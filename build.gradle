plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def javaVersion = JavaVersion.toVersion(project.javaVersion)

repositories {
    // Our refurbished AdvancedChatCore, published locally with `publishToMavenLocal`.
    mavenLocal()
    mavenCentral()
    maven { name = 'FabricMC'; url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { name = 'JitPack'; url = 'https://jitpack.io' }
}

dependencies {
    // 26.x ships unobfuscated — no Yarn/Mojang mappings, Loom does not remap.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "maven.modrinth:malilib:${project.malilib_version}"

    // AdvancedChatCore (our refurbished fork, from mavenLocal) + libraries it bundles that this
    // module also references at compile time.
    implementation "io.github.darkkronicle:AdvancedChatCore:${project.advancedchat_version}"
    implementation "com.github.DarkKronicle.Konstruct:core:${project.konstruct_version}"
    implementation "io.github.maowimpl:owo:${project.owo_version}"

    // JavaScript filters (Nashorn). Nashorn was removed from the JDK in Java 15+. Kept as a compile
    // dependency; runtime bundling of the standalone engine on Java 25 is handled/decided separately
    // (the original left the include lines commented out, so the feature degrades if absent).
    implementation "org.openjdk.nashorn:nashorn-core:${project.nashorn_version}"
    implementation "org.javadelight:delight-nashorn-sandbox:${project.nashorn_sandbox_version}"

    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.javaVersion)
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withSourcesJar()
}

jar {
    from 'LICENSE.txt'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
